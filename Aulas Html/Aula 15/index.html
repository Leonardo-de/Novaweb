<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 15 - JavaScript aplicado a Formulários</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="cabecalho">
            <p class="aula">Linguagem de Marcação</p>
            <h1>Aula 15 — JavaScript aplicado a Formulários</h1>
            <p>Preencha os dados e envie seu cadastro.</p>
        </header>

        <form class="formulario" id="formulario" onsubmit="cadastrar(event)">
            <p class="mensagem" id="mensagem" role="status" aria-live="polite"></p>

            <div class="campo">
                <label for="nome">Nome completo</label>
                <input id="nome" name="nome" type="text" placeholder="Seu nome" required minlength="3">
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" placeholder="voce@exemplo.com" required>
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <input id="telefone" name="telefone" type="tel" placeholder="(11) 99999-9999" required>
            </div>

            <button class="botao-enviar" type="submit">Cadastrar</button>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
