<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Aula 14 - CSS para Formulários</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="container py-5">
        <header class="cabecalho">
            <p class="aula">Linguagem de Marcação</p>
            <h1>Aula 14 — CSS para Formulários</h1>
            <p>Preencha os campos. Use o botão para habilitar cada campo; ao sair dele, será desabilitado novamente.</p>
        </header>

        <form class="formulario card shadow-sm" id="formulario">
            <div class="campo">
                <label for="nome">Nome completo</label>
                <div class="linha-campo">
                    <input class="form-control" id="nome" name="nome" type="text" placeholder="Seu nome" required minlength="3" disabled>
                    <button class="botao-habilitar btn btn-outline-primary" type="button" data-campo="nome">Habilitar</button>
                </div>
                <small>Informe pelo menos 3 caracteres.</small>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <div class="linha-campo">
                    <input class="form-control" id="email" name="email" type="email" placeholder="voce@exemplo.com" required disabled>
                    <button class="botao-habilitar btn btn-outline-primary" type="button" data-campo="email">Habilitar</button>
                </div>
                <small>Digite um endereço de e-mail válido.</small>
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <div class="linha-campo">
                    <input class="form-control" id="telefone" name="telefone" type="tel" placeholder="(11) 99999-9999" pattern="\(?[0-9]{2}\)? ?9?[0-9]{4}-?[0-9]{4}" required disabled>
                    <button class="botao-habilitar btn btn-outline-primary" type="button" data-campo="telefone">Habilitar</button>
                </div>
                <small>Use o formato (17) 99999-9999.</small>
            </div>

            <div class="campo">
                <label for="idade">Idade</label>
                <div class="linha-campo">
                    <input class="form-control" id="idade" name="idade" type="number" placeholder="Sua idade" min="1" max="120" required disabled>
                    <button class="botao-habilitar btn btn-outline-primary" type="button" data-campo="idade">Habilitar</button>
                </div>
                <small>Informe um número entre 1 e 120.</small>
            </div>

            <button class="botao-enviar btn btn-primary" type="submit">Enviar formulário</button>
            <p class="mensagem" id="mensagem" role="status" aria-live="polite"></p>
        </form>
    </main>

    <script>
        const formulario = document.querySelector('#formulario');
        const mensagem = document.querySelector('#mensagem');

        document.querySelectorAll('.botao-habilitar').forEach((botao) => {
            botao.addEventListener('click', () => {
                const campo = document.getElementById(botao.dataset.campo);
                campo.disabled = false;
                campo.focus();
            });
        });

        formulario.querySelectorAll('input').forEach((campo) => {
            campo.addEventListener('blur', () => {
                campo.disabled = true;
            });
        });

        formulario.addEventListener('submit', (evento) => {
            evento.preventDefault();
            mensagem.textContent = 'Formulário enviado com sucesso!';
        });
    </script>
</body>
</html>
